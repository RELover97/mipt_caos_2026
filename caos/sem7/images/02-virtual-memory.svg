xt x="449" y="305" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#526579" text-anchor="start">чтение / запись</text><rect x="436" y="340" width="278" height="62" rx="8" fill="#ffffff" stroke="#36805c" stroke-width="1.5"/><text x="449" y="364" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#172c43" text-anchor="start">Куча (malloc)</text><text x="449" y="385" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#526579" text-anchor="start">чтение / запись</text><rect x="436" y="420" width="278" height="62" rx="8" fill="#ffffff" stroke="#36805c" stroke-width="1.5"/><text x="449" y="444" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#172c43" text-anchor="start">Стек потока</text><text x="449" y="465" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#526579" text-anchor="start">чтение / запись</text><rect x="830" y="170" width="230" height="76" rx="12" fill="#f0f3f7" stroke="#8492a5" stroke-width="1.5"/><text x="845" y="197" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#172c43" text-anchor="start">Страница кода</text><text x="845" y="221" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#172c43" text-anchor="start">общая, неизменяемая</text><rect x="830" y="285" width="230" height="76" rx="12" fill="#e6f1ff" stroke="#3974b8" stroke-width="1.5"/><text x="845" y="312" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#172c43" text-anchor="start">Страница данных A</text><text x="845" y="336" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#172c43" text-anchor="start">value = 7</text><rect x="830" y="420" width="230" height="76" rx="12" fill="#e6f5ed" stroke="#36805c" stroke-width="1.5"/><text x="845" y="447" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#172c43"