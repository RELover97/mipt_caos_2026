<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526579"/></marker></defs><rect x="0" y="0" width="1100" height="650" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="36" y="44" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#172c43" text-anchor="start">Адресное пространство не равно оперативной памяти</text><text x="36" y="76" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#526579" text-anchor="start">Одинаковый виртуальный адрес в разных процессах может указывать на разные физические страницы.</text><text x="45" y="115" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#172c43" text-anchor="start">Процесс A</text><text x="425" y="115" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#172c43" text-anchor="start">Процесс B</text><text x="830" y="115" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#172c43" text-anchor="start">Физическая память</text><rect x="40" y="135" width="310" height="400" rx="12" fill="#e6f1ff" stroke="#3974b8" stroke-width="1.5"/><text x="57" y="164" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#526579" text-anchor="start">виртуальные адреса</text><rect x="56" y="180" width="278" height="62" rx="8" fill="#ffffff" stroke="#3974b8" stroke-width="1.5"/><text x="69" y="204" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#172c43" text-anchor="start">Код</text><text x="69" y="225" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#526579" text-anchor="start">чтение / исполнение</text><rect x="56" y="260" width="278" height="62" rx="8" fill="#ffffff" stroke="#3974b8" stroke-width="1.5"/><text x="69" y="284" font-family="DejaV