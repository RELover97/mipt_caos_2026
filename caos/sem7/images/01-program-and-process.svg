<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526579"/></marker></defs><rect x="0" y="0" width="1100" height="590" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="36" y="44" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#172c43" text-anchor="start">Одна программа — два процесса</text><text x="36" y="76" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#526579" text-anchor="start">Файл содержит код и исходные данные. При запуске ядро создаёт контекст выполнения.</text><rect x="330" y="105" width="440" height="110" rx="12" fill="#f0f3f7" stroke="#8492a5" stroke-width="1.5"/><text x="348" y="137" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">Исполняемый файл на диске</text><text x="348" y="167" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">./build/01_process/process (ELF)</text><path d="M420,215 L280,278" fill="none" stroke="#526579" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M680,215 L820,278" fill="none" stroke="#526579" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="270" y="240" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#526579" text-anchor="start">запуск 1</text><text x="755" y="240" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#526579" text-anchor="start">запуск 2</text><rect x="40" y="280" width="490" height="235" rx="12" fill="#e6f1ff" stroke="#3974b8" stroke-width="1.5"/><text x="58" y="312" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">Процесс A · PID 4101</text><text x="58" y="342" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Состояние выполнения: PC, SP, регистры</text><text x="58" y="370" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Своё виртуальное адресное пространство</text><text x="58" y="398" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Дескрипторы 0, 1, 2; рабочий каталог</text><text x="58" y="426" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Права, данные планировщика, учёт ресурсов</text><rect x="570" y="280" width="490" height="235" rx="12" fill="#e6f5ed" stroke="#36805c" stroke-width="1.5"/><text x="588" y="312" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">Процесс B · PID 4102</text><text x="588" y="342" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Состояние выполнения: PC, SP, регистры</text><text x="588" y="370" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Своё виртуальное адресное пространство</text><text x="588" y="398" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Дескрипторы 0, 1, 2; рабочий каталог</text><text x="588" y="426" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Права, данные планировщика, учёт ресурсов</text><text x="550" y="555" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#526579" text-anchor="middle">Код может физически разделяться; изменяемые частные данные изолированы.</text></svg>