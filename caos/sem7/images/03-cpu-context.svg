<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526579"/></marker></defs><rect x="0" y="0" width="1100" height="570" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="36" y="44" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#172c43" text-anchor="start">Одно ядро CPU — несколько задач</text><text x="36" y="76" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#526579" text-anchor="start">Планировщик выбирает, какая готовая задача получит процессорное время.</text><text x="40" y="123" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">Время →</text><rect x="40" y="145" width="280" height="65" rx="12" fill="#e6f1ff" stroke="#3974b8" stroke-width="1.5"/><text x="180.0" y="185" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="middle">Выполняется A</text><rect x="330" y="145" width="185" height="65" rx="12" fill="#f0f3f7" stroke="#8492a5" stroke-width="1.5"/><text x="422.5" y="185" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="middle">Ядро</text><rect x="525" y="145" width="250" height="65" rx="12" fill="#e6f5ed" stroke="#36805c" stroke-width="1.5"/><text x="650.0" y="185" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="middle">Выполняется B</text><rect x="785" y="145" width="275" height="65" rx="12" fill="#e6f1ff" stroke="#3974b8" stroke-width="1.5"/><text x="922.5" y="185" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="middle">Снова A</text><rect x="40" y="270" width="320" height="150" rx="12" fill="#e6f1ff" stroke="#3974b8" stroke-width="1.5"/><text x="58" y="302" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">Задача A</text><text x="58" y="332" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">PC: следующая инструкция</text><text x="58" y="360" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">SP: вершина стека</text><text x="58" y="388" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Остальные регистры</text><rect x="390" y="270" width="320" height="150" rx="12" fill="#f0f3f7" stroke="#8492a5" stroke-width="1.5"/><text x="408" y="302" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">Переключение</text><text x="408" y="332" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Сохранить контекст A</text><text x="408" y="360" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Выбрать задачу B</text><text x="408" y="388" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Восстановить контекст B</text><rect x="740" y="270" width="320" height="150" rx="12" fill="#e6f5ed" stroke="#36805c" stroke-width="1.5"/><text x="758" y="302" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">Задача B</text><text x="758" y="332" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Свой PC и SP</text><text x="758" y="360" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Свои регистры</text><text x="758" y="388" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Своя точка продолжения</text><path d="M360,345 L390,345" fill="none" stroke="#526579" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M710,345 L740,345" fill="none" stroke="#526579" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="40" y="475" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#172c43" text-anchor="start">A не уничтожается при паузе: её контекст сохранён, память и ресурсы остаются.</text><text x="40" y="510" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#526579" text-anchor="start">При возобновлении A продолжит с сохранённого состояния, а не с main().</text></svg>