<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="635" viewBox="0 0 1100 635"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526579"/></marker></defs><rect x="0" y="0" width="1100" height="635" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="36" y="44" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" fill="#172c43" text-anchor="start">Как ядро описывает задачу</text><text x="36" y="76" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#526579" text-anchor="start">task_struct хранит сведения о задаче и ссылки на связанные структуры ядра.</text><rect x="35" y="150" width="340" height="345" rx="12" fill="#e6f1ff" stroke="#3974b8" stroke-width="1.5"/><text x="53" y="182" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">struct task_struct</text><text x="53" y="212" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">pid / tgid — идентификаторы</text><text x="53" y="240" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">__state — состояние задачи</text><text x="53" y="268" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">real_parent — родитель</text><text x="53" y="296" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">thread — контекст архитектуры</text><text x="53" y="324" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">mm → адресное пространство</text><text x="53" y="352" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">files → таблица дескрипторов</text><text x="53" y="380" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">fs → рабочий каталог</text><text x="53" y="408" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">cred → учётные данные</text><rect x="600" y="105" width="465" height="90" rx="12" fill="#e6f5ed" stroke="#36805c" stroke-width="1.5"/><text x="618" y="137" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">mm_struct</text><text x="618" y="167" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Отображения и таблицы страниц</text><rect x="600" y="215" width="465" height="90" rx="12" fill="#fff1d7" stroke="#a66a15" stroke-width="1.5"/><text x="618" y="247" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">files_struct</text><text x="618" y="277" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">fd 0, 1, 2, … → объекты file</text><rect x="600" y="325" width="465" height="90" rx="12" fill="#f0f3f7" stroke="#8492a5" stroke-width="1.5"/><text x="618" y="357" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">fs_struct</text><text x="618" y="387" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">Текущий каталог, корень, umask</text><rect x="600" y="435" width="465" height="90" rx="12" fill="#f0f3f7" stroke="#8492a5" stroke-width="1.5"/><text x="618" y="467" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#172c43" text-anchor="start">cred</text><text x="618" y="497" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#172c43" text-anchor="start">UID, GID, права и полномочия</text><path d="M375,324 L600,150" fill="none" stroke="#526579" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M375,352 L600,260" fill="none" stroke="#526579" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M375,380 L600,370" fill="none" stroke="#526579" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M375,408 L600,480" fill="none" stroke="#526579" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="36" y="560" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#526579" text-anchor="start">Это схема связей, а не расположение полей в памяти.</text><text x="36" y="592" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#526579" text-anchor="start">У каждого потока свой task_struct; часть структур может быть общей.</text></svg>