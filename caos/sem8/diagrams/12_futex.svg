<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Futex: сравнить значение и только затем спать в ядре</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">FUTEX_WAIT(addr, expected=0) проверяет 32-битное слово в момент засыпания</text><rect fill="#FFFFFF" height="453" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="594" x="34" y="109" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="52" y="127" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="73" y="156">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="109" y="154">В памяти всё ещё 0</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="58" y="193">Вызов FUTEX_WAIT(&amp;ready, 0)</text><rect fill="#FFFFFF" height="453" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="593" x="653" y="109" /><rect fill="#A96B08" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="671" y="127" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="692" y="156">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="728" y="154">В памяти уже 1</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="677" y="193">Вызов FUTEX_WAIT(&amp;ready, 0)</text><rect fill="#EAF3FF" height="105" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="503" x="77" y="236" /><rect fill="#2364C8" height="105" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="77" y="236" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="101" y="274">ready == 0</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="101" y="306">Ядро может поставить поток в очередь</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="3" x1="324" x2="324" y1="341" y2="399" /><polygon fill="#2364C8" points="324,399 318.7263190753538,389.3465918192059 329.2736809246462,389.3465918192059" /><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="433" x="117" y="415" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="129" y="440">Сон → FUTEX_WAKE → перепроверка</text><rect fill="#FFF3D7" height="105" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="507" x="695" y="236" /><rect fill="#A96B08" height="105" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="695" y="236" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="719" y="274">ready != expected</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="719" y="306">Ядро откажет засыпать</text><line stroke="#A96B08" stroke-linecap="round" stroke-width="3" x1="947" x2="947" y1="341" y2="399" /><polygon fill="#A96B08" points="947,399 941.7263190753538,389.3465918192059 952.2736809246462,389.3465918192059" /><rect fill="#FFF3D7" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="427" x="735" y="415" /><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="747" y="440">-1; errno = EAGAIN</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">FUTEX_WAKE пробуждает ожидающих, но НЕ изменяет слово ready.</text></svg>