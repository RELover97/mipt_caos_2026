<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Два сотрудника и одна общая доска</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Аналогия: оба получают задание увеличить число заказов на доске</text><rect fill="#FFFFFF" height="440" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="1209" x="35" y="113" /><circle cx="156" cy="224" fill="#2364C8" r="26" /><rect fill="#2364C8" height="75" rx="18" ry="18" stroke="none" stroke-width="1.5" width="59" x="127" y="258" /><line stroke="#2364C8" stroke-linecap="round" stroke-width="9" x1="133" x2="114" y1="336" y2="369" /><line stroke="#2364C8" stroke-linecap="round" stroke-width="9" x1="179" x2="198" y1="336" y2="369" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="156" y="415">Сотрудник A</text><circle cx="1104" cy="224" fill="#6F48BC" r="26" /><rect fill="#6F48BC" height="75" rx="18" ry="18" stroke="none" stroke-width="1.5" width="59" x="1075" y="258" /><line stroke="#6F48BC" stroke-linecap="round" stroke-width="9" x1="1081" x2="1062" y1="336" y2="369" /><line stroke="#6F48BC" stroke-linecap="round" stroke-width="9" x1="1127" x2="1146" y1="336" y2="369" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="1104" y="415">Сотрудник B</text><rect fill="#EAF3FF" height="263" rx="20" ry="20" stroke="#2364C8" stroke-width="3" width="491" x="392" y="178" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="638" y="224">ОБЩАЯ ДОСКА</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" text-anchor="middle" x="638" y="325">Заказов: 5</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="4" x1="237" x2="388" y1="258" y2="258" /><polygon fill="#2364C8" points="388,258 378.3465918192059,263.2736809246462 378.3465918192059,252.72631907535376" /><line stroke="#6F48BC" stroke-linecap="round" stroke-width="4" x1="1024" x2="889" y1="258" y2="258" /><polygon fill="#6F48BC" points="889,258 898.6534081807941,252.72631907535376 898.6534081807941,263.2736809246462" /><rect fill="#EAF3FF" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="264" x="104" y="435" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="116" y="460">A записал себе: 5</text><rect fill="#F2EDFC" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="266" x="916" y="435" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="928" y="460">B записал себе: 5</text><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="640" y="493">Оба считают 5 + 1 и хотят написать 6.</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Копии каждого потока отдельные; доска одна. Без договорённости обновление может потеряться.</text></svg>