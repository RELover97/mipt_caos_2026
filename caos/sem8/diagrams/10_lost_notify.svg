<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Пропущенное уведомление: сигнал не хранится «на будущее»</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Плохой протокол отделяет проверку ready от постановки на ожидание</text><rect fill="#FFFFFF" height="456" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="590" x="36" y="108" /><rect fill="#BC4145" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="54" y="126" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="75" y="155">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="111" y="153">Неверно: проверил без mutex</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="60" y="192">Проверка и сон разорваны по времени</text><rect fill="#FFFFFF" height="456" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="588" x="656" y="108" /><rect fill="#087D6B" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="674" y="126" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="695" y="155">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="731" y="153">Верно: проверка под mutex</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="680" y="192">wait атомарно отпускает mutex и начинает ждать</text><rect fill="#FFE9EB" height="51" rx="9" ry="9" stroke="none" stroke-width="1.5" width="526" x="62" y="233" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="81" y="266">A: увидел ready=false</text><rect fill="#FFE9EB" height="51" rx="9" ry="9" stroke="none" stroke-width="1.5" width="526" x="62" y="300" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="81" y="333">B: ready=true; signal()</text><rect fill="#FFE9EB" height="51" rx="9" ry="9" stroke="none" stroke-width="1.5" width="526" x="62" y="367" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="81" y="400">A: только теперь wait()</text><rect fill="#FFE9EB" height="51" rx="9" ry="9" stroke="none" stroke-width="1.5" width="526" x="62" y="434" /><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="81" y="467">Сигнал прошёл раньше: таймаут</text><rect fill="#E7F6F0" height="51" rx="9" ry="9" stroke="none" stroke-width="1.5" width="526" x="683" y="233" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="702" y="266">A: lock(); ready=false</text><rect fill="#E7F6F0" height="51" rx="9" ry="9" stroke="none" stroke-width="1.5" width="526" x="683" y="300" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="702" y="333">A: cond_wait() + unlock</text><rect fill="#E7F6F0" height="51" rx="9" ry="9" stroke="none" stroke-width="1.5" width="526" x="683" y="367" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="702" y="400">B: lock(); ready=true; signal()</text><rect fill="#E7F6F0" height="51" rx="9" ry="9" stroke="none" stroke-width="1.5" width="526" x="683" y="434" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="702" y="467">A: проснулся, lock(); ready=true</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">В исправленном протоколе B меняет ready под тем же mutex, что использует A при ожидании.</text></svg>