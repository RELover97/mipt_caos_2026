<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Что именно делает pthread_cond_wait?</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Предикат проверяется под mutex; wait отпускает mutex, затем возвращает его перед выходом</text><rect fill="#FFFFFF" height="414" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="229" x="35" y="116" /><rect fill="#087D6B" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="53" y="134" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="74" y="163">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="110" y="161">lock()</text><rect fill="#E7F6F0" height="161" rx="10" ry="10" stroke="none" stroke-width="1.5" width="190" x="54" y="235" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="65" y="279">потребитель</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="65" y="316">берёт mutex</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="2.5" x1="264" x2="280" y1="317" y2="317" /><polygon fill="#2364C8" points="280,317 273.85692206676737,320.3559787702294 273.85692206676737,313.6440212297706" /><rect fill="#FFFFFF" height="414" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="229" x="282" y="116" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="300" y="134" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="321" y="163">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="357" y="161">проверка</text><rect fill="#EAF3FF" height="161" rx="10" ry="10" stroke="none" stroke-width="1.5" width="190" x="301" y="235" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="312" y="279">full=false</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="312" y="316">нужно ждать</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="2.5" x1="511" x2="527" y1="317" y2="317" /><polygon fill="#2364C8" points="527,317 520.8569220667674,320.3559787702294 520.8569220667674,313.6440212297706" /><rect fill="#FFFFFF" height="414" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="229" x="529" y="116" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="547" y="134" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="568" y="163">3</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="604" y="161">cond_wait</text><rect fill="#EAF3FF" height="161" rx="10" ry="10" stroke="none" stroke-width="1.5" width="190" x="548" y="235" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="559" y="279">отпускает mutex</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="559" y="316">и засыпает</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="2.5" x1="758" x2="774" y1="317" y2="317" /><polygon fill="#2364C8" points="774,317 767.8569220667674,320.3559787702294 767.8569220667674,313.6440212297706" /><rect fill="#FFFFFF" height="414" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="229" x="776" y="116" /><rect fill="#6F48BC" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="794" y="134" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="815" y="163">4</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="851" y="161">producer</text><rect fill="#F2EDFC" height="161" rx="10" ry="10" stroke="none" stroke-width="1.5" width="190" x="795" y="235" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="806" y="279">кладёт элемент</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="806" y="316">full=true; signal</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="2.5" x1="1005" x2="1021" y1="317" y2="317" /><polygon fill="#2364C8" points="1021,317 1014.8569220667674,320.3559787702294 1014.8569220667674,313.6440212297706" /><rect fill="#FFFFFF" height="414" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="229" x="1023" y="116" /><rect fill="#087D6B" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="1041" y="134" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="1062" y="163">5</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="1098" y="161">возврат</text><rect fill="#E7F6F0" height="161" rx="10" ry="10" stroke="none" stroke-width="1.5" width="190" x="1042" y="235" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="1053" y="279">захватывает mutex</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="1053" y="316">снова; while full?</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">После wake поток не имеет права считать full=true без повторной проверки.</text></svg>