<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Как создать поток и дождаться его</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">pthread_create запускает новую работу; pthread_join — дождаться окончания</text><rect fill="#FFFFFF" height="467" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="1210" x="35" y="105" /><rect fill="#E9EDF4" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="130" x="64" y="147" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="76" y="172">main</text><line stroke="#D9E2EF" stroke-linecap="round" stroke-width="4" x1="227" x2="1165" y1="161" y2="161" /><rect fill="#EAF3FF" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="130" x="64" y="273" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="76" y="298">поток 1</text><line stroke="#D9E2EF" stroke-linecap="round" stroke-width="4" x1="227" x2="1165" y1="287" y2="287" /><rect fill="#F2EDFC" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="130" x="64" y="398" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="76" y="423">поток 2</text><line stroke="#D9E2EF" stroke-linecap="round" stroke-width="4" x1="227" x2="1165" y1="412" y2="412" /><line stroke="#2364C8" stroke-linecap="round" stroke-width="3" x1="307" x2="409" y1="161" y2="286" /><polygon fill="#2364C8" points="409,286 398.8109078083931,281.8548341033277 406.9828468234367,275.18653186705205" /><line stroke="#6F48BC" stroke-linecap="round" stroke-width="3" x1="500" x2="596" y1="161" y2="411" /><polygon fill="#6F48BC" points="596,411 587.6162786966531,403.8786786964913 597.4626412984427,400.0976754574041" /><rect fill="#EAF3FF" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="103" x="274" y="111" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="286" y="136">create</text><rect fill="#F2EDFC" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="103" x="459" y="111" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="471" y="136">create</text><rect fill="#EAF3FF" height="65" rx="10" ry="10" stroke="#2364C8" stroke-width="1.5" width="320" x="399" y="254" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="420" y="292">thread_work(&amp;ids[0])</text><rect fill="#F2EDFC" height="65" rx="10" ry="10" stroke="#6F48BC" stroke-width="1.5" width="330" x="595" y="379" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="614" y="416">thread_work(&amp;ids[1])</text><line stroke="#087D6B" stroke-linecap="round" stroke-width="3" x1="722" x2="894" y1="289" y2="162" /><polygon fill="#087D6B" points="894,162 889.3666932137812,171.97659602393415 883.101597578321,163.49158461212988" /><line stroke="#087D6B" stroke-linecap="round" stroke-width="3" x1="930" x2="1040" y1="413" y2="162" /><polygon fill="#087D6B" points="1040,162 1040.9553847837751,172.95843236575973 1031.2949937268986,168.72479485079387" /><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="95" x="845" y="111" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="857" y="136">join</text><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="95" x="1011" y="111" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="1023" y="136">join</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="337" y="515">create НЕ ждёт завершения потока</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="337" y="546">join ждёт — и только потом main читает итог</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Порядок действий потоков между create и join заранее не задан.</text></svg>