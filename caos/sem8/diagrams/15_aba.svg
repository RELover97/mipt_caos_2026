<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Ошибка ABA: адрес снова тот же, но стек уже другой</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">CAS проверяет head == A, но не знает, что между чтением и записью A удаляли и возвращали</text><rect fill="#FFFFFF" height="445" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="283" x="34" y="111" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="52" y="129" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="73" y="158">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="109" y="156">T1 запомнил</text><rect fill="#EAF3FF" height="88" rx="11" ry="11" stroke="none" stroke-width="1.5" width="245" x="54" y="244" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="176" y="294">A → B → C</text><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="59" y="397">old=A; next=B</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="318" x2="338" y1="287" y2="287" /><polygon fill="#56677D" points="338,287 330.97933950487703,290.83540430883363 330.97933950487703,283.16459569116637" /><rect fill="#FFFFFF" height="445" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="283" x="341" y="111" /><rect fill="#6F48BC" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="359" y="129" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="380" y="158">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="416" y="156">T2 удалил A и B</text><rect fill="#EAF3FF" height="88" rx="11" ry="11" stroke="none" stroke-width="1.5" width="245" x="361" y="244" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="483" y="294">C</text><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="366" y="397">A и B вне стека</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="625" x2="645" y1="287" y2="287" /><polygon fill="#56677D" points="645,287 637.979339504877,290.83540430883363 637.979339504877,283.16459569116637" /><rect fill="#FFFFFF" height="445" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="283" x="648" y="111" /><rect fill="#A96B08" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="666" y="129" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="687" y="158">3</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="723" y="156">T2 вернул A</text><rect fill="#FFF3D7" height="88" rx="11" ry="11" stroke="none" stroke-width="1.5" width="245" x="668" y="244" /><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="790" y="294">A → C</text><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="673" y="397">head снова A</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="932" x2="952" y1="287" y2="287" /><polygon fill="#56677D" points="952,287 944.979339504877,290.83540430883363 944.979339504877,283.16459569116637" /><rect fill="#FFFFFF" height="445" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="283" x="955" y="111" /><rect fill="#BC4145" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="973" y="129" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="994" y="158">4</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="1030" y="156">T1 делает CAS</text><rect fill="#FFE9EB" height="88" rx="11" ry="11" stroke="none" stroke-width="1.5" width="245" x="975" y="244" /><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="1097" y="294">B → C</text><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="980" y="397">ошибка: B вернулся</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Память не освобождается! Проблема вызвана именно повторным использованием узла A.</text></svg>