fill="#FFFFFF" height="449" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="286" x="344" y="111" /><rect fill="#6F48BC" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="362" y="129" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="383" y="158">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="419" y="156">Уведомление</text><rect fill="#F2EDFC" height="121" rx="11" ry="11" stroke="none" stroke-width="1.5" width="236" x="369" y="245" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="383" y="287">noise: broadcast()</text><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="383" y="324">но value не изменился</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="632" x2="651" y1="311" y2="311" /><polygon fill="#56677D" points="651,311 643.979339504877,314.83540430883363 643.979339504877,307.16459569116637" /><rect fill="#FFFFFF" height="449" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="286" x="652" y="111" /><rect fill="#BC4145" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="670" y="129" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="691" y="158">3</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="727" y="156">Проверка</text><rect fill="#FFE9EB" height="121" rx="11" ry="11" stroke="none" stroke-width="1.5" width="236" x="677" y="245" /><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="691" y="287">consumer проснулся</text><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="691" y="324">full всё ещё false</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="940" x2="959" y1="311" y2="311" /><polygon fill="#56677D" points="959,311 951.979339504877,314.83540430883363 951.979339504877,307.16459569116637" /><rect fill="#FFFFFF" height="449" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="286" x="960" y="111" /><rect fill="#087D6B" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="978" y="129" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="999" y="158">4</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="1035" y="156">Снова ждать</text><rect fill="#E7F6F0" height="121" rx="11" ry="11" stroke="none" stroke-width="1.5" width="236" x="985" y="245" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="999" y="287">while повторяется</text><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="999" y="324">без чтения value</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Это пример нерелевантного уведомления. POSIX допускает также настоящие spurious wakeups.</text></svg>