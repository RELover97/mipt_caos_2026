<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Одна ячейка — как почтовый ящик</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Пока ящик занят, положить второй элемент нельзя; пока пуст — нечего забирать</text><rect fill="#FFFFFF" height="425" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="1202" x="39" y="119" /><circle cx="165" cy="225" fill="#2364C8" r="26" /><rect fill="#2364C8" height="75" rx="18" ry="18" stroke="none" stroke-width="1.5" width="59" x="136" y="259" /><line stroke="#2364C8" stroke-linecap="round" stroke-width="9" x1="142" x2="123" y1="337" y2="370" /><line stroke="#2364C8" stroke-linecap="round" stroke-width="9" x1="188" x2="207" y1="337" y2="370" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="165" y="416">Производитель</text><circle cx="1106" cy="225" fill="#6F48BC" r="26" /><rect fill="#6F48BC" height="75" rx="18" ry="18" stroke="none" stroke-width="1.5" width="59" x="1077" y="259" /><line stroke="#6F48BC" stroke-linecap="round" stroke-width="9" x1="1083" x2="1064" y1="337" y2="370" /><line stroke="#6F48BC" stroke-linecap="round" stroke-width="9" x1="1129" x2="1148" y1="337" y2="370" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="1106" y="416">Потребитель</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="4" x1="258" x2="447" y1="284" y2="284" /><polygon fill="#2364C8" points="447,284 437.3465918192059,289.2736809246462 437.3465918192059,278.7263190753538" /><rect fill="#EAF3FF" height="241" rx="20" ry="20" stroke="#2364C8" stroke-width="4" width="375" x="451" y="182" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="639" y="227">ОБЩИЙ ЯЩИК</text><rect fill="#FFF3D7" height="93" rx="10" ry="10" stroke="#A96B08" stroke-width="2" width="161" x="559" y="250" /><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" x="639" y="311">Число 7</text><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="200" x="538" y="365" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="550" y="390">full = true</text><line stroke="#6F48BC" stroke-linecap="round" stroke-width="4" x1="837" x2="996" y1="284" y2="284" /><polygon fill="#6F48BC" points="996,284 986.3465918192059,289.2736809246462 986.3465918192059,278.7263190753538" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="639" y="480">mutex защищает full и value; cond_wait позволяет ждать, не удерживая mutex.</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Само уведомление не кладёт число в ящик. Данные хранит value, состояние — full.</text></svg>