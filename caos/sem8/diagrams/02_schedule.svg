<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Конкурентность ≠ обязательно параллельность</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">На одном ядре ОС переключает потоки; на двух они могут исполняться одновременно</text><rect fill="#FFFFFF" height="465" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="592" x="34" y="105" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="52" y="123" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="73" y="152">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="109" y="150">Один CPU</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="58" y="189">Время идёт слева направо</text><rect fill="#FFFFFF" height="465" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="592" x="654" y="105" /><rect fill="#6F48BC" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="672" y="123" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="693" y="152">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="729" y="150">Два ядра CPU</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="678" y="189">Оба потока могут идти одновременно</text><rect fill="#2364C8" height="53" rx="3" ry="3" stroke="none" stroke-width="1.5" width="110" x="73" y="254" /><rect fill="#6F48BC" height="53" rx="3" ry="3" stroke="none" stroke-width="1.5" width="110" x="183" y="254" /><rect fill="#2364C8" height="53" rx="3" ry="3" stroke="none" stroke-width="1.5" width="110" x="293" y="254" /><rect fill="#6F48BC" height="53" rx="3" ry="3" stroke="none" stroke-width="1.5" width="110" x="403" y="254" /><rect fill="#2364C8" height="53" rx="3" ry="3" stroke="none" stroke-width="1.5" width="440" x="692" y="254" /><rect fill="#6F48BC" height="53" rx="3" ry="3" stroke="none" stroke-width="1.5" width="440" x="692" y="371" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="73" y="232">Ядро 1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="692" y="232">Ядро 1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="692" y="350">Ядро 2</text><rect fill="#EAF3FF" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="112" x="73" y="368" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="85" y="393">Поток A</text><rect fill="#F2EDFC" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="112" x="202" y="368" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="214" y="393">Поток B</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="73" y="477">Переключение между A и B</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="692" y="477">Одновременная работа A и B</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">В обоих случаях порядок обращения к общей памяти может быть непредсказуемым.</text></svg>