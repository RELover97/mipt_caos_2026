<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">CAS-стек: меняем только указатель head</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Узлы живут до конца программы; каждый добавляется лишь однажды, повторного push нет</text><rect fill="#FFFFFF" height="454" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="588" x="34" y="110" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="52" y="128" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="73" y="157">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="109" y="155">push(40)</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="58" y="194">Новый узел 40 связывается с прежней вершиной</text><rect fill="#FFFFFF" height="454" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="588" x="656" y="110" /><rect fill="#087D6B" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="674" y="128" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="695" y="157">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="731" y="155">pop()</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="680" y="194">CAS переносит head на следующий узел</text><rect fill="#E7F6F0" height="74" rx="12" ry="12" stroke="#087D6B" stroke-width="2" width="98" x="100" y="277" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="149" y="322">40</text><rect fill="#EAF3FF" height="74" rx="12" ry="12" stroke="#2364C8" stroke-width="2" width="98" x="211" y="277" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="260" y="322">30</text><rect fill="#EAF3FF" height="74" rx="12" ry="12" stroke="#2364C8" stroke-width="2" width="98" x="322" y="277" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="371" y="322">20</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="3" x1="198" x2="211" y1="315" y2="315" /><polygon fill="#2364C8" points="211,315 203.97933950487703,318.83540430883363 203.97933950487703,311.16459569116637" /><line stroke="#2364C8" stroke-linecap="round" stroke-width="3" x1="309" x2="322" y1="315" y2="315" /><polygon fill="#2364C8" points="322,315 314.97933950487703,318.83540430883363 314.97933950487703,311.16459569116637" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="140" y="239">head</text><line stroke="#087D6B" stroke-linecap="round" stroke-width="3" x1="140" x2="145" y1="248" y2="272" /><polygon fill="#087D6B" points="145,272 137.86831596967508,263.6250920666787 148.19397670001982,261.47391274785684" /><rect fill="#E7F6F0" height="74" rx="12" ry="12" stroke="#087D6B" stroke-width="2" width="98" x="726" y="277" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="775" y="322">40</text><rect fill="#EAF3FF" height="74" rx="12" ry="12" stroke="#2364C8" stroke-width="2" width="98" x="837" y="277" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="886" y="322">30</text><rect fill="#EAF3FF" height="74" rx="12" ry="12" stroke="#2364C8" stroke-width="2" width="98" x="948" y="277" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="997" y="322">20</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="3" x1="824" x2="837" y1="315" y2="315" /><polygon fill="#2364C8" points="837,315 829.979339504877,318.83540430883363 829.979339504877,311.16459569116637" /><line stroke="#2364C8" stroke-linecap="round" stroke-width="3" x1="935" x2="948" y1="315" y2="315" /><polygon fill="#2364C8" points="948,315 940.979339504877,318.83540430883363 940.979339504877,311.16459569116637" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="766" y="239">head</text><line stroke="#087D6B" stroke-linecap="round" stroke-width="3" x1="766" x2="882" y1="248" y2="272" /><polygon fill="#087D6B" points="882,272 871.4783221459714,275.2084723991403 873.6152767644331,264.87985840990893" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="105" y="426">CAS: old=30  →  new=40</text><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="724" y="426">CAS: old=40  →  new=30</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">При проигрыше CAS пересчитываем next и пробуем снова. В примере не освобождаем узлы.</text></svg>