<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Мьютекс — один ключ на критическую секцию</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Пока поток A выполняет read → add → write, поток B ждёт того же mutex</text><rect fill="#FFFFFF" height="454" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="1212" x="34" y="105" /><rect fill="#EAF3FF" height="318" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="350" x="60" y="151" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="84" y="190">Поток A</text><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="265" x="84" y="218" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="96" y="243">lock() → получил ключ</text><rect fill="#E7F6F0" height="104" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="304" x="84" y="279" /><rect fill="#087D6B" height="104" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="84" y="279" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="108" y="317">counter: 5 → 6</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="108" y="349">Вся операция под mutex</text><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="265" x="84" y="408" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="96" y="433">unlock() → отдал ключ</text><rect fill="#FFF3D7" height="318" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="323" x="457" y="151" /><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="480" y="190">Общий mutex</text><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" x="623" y="309">КЛЮЧ</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="623" y="346">Только один владелец</text><line stroke="#087D6B" stroke-linecap="round" stroke-width="3" x1="411" x2="457" y1="301" y2="301" /><polygon fill="#087D6B" points="457,301 447.3465918192059,306.2736809246462 447.3465918192059,295.7263190753538" /><rect fill="#F2EDFC" height="318" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="364" x="824" y="151" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="850" y="190">Поток B</text><rect fill="#FFF3D7" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="275" x="850" y="221" /><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="862" y="246">lock() → ждёт</text><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="301" x="850" y="317" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="862" y="342">после unlock(A): lock(B)</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="850" y="402">Читает уже counter = 6</text><line stroke="#6F48BC" stroke-linecap="round" stroke-width="3" x1="783" x2="824" y1="344" y2="344" /><polygon fill="#6F48BC" points="824,344 814.3465918192059,349.2736809246462 814.3465918192059,338.7263190753538" /><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Один mutex должен защищать ВСЕ обращения к общему состоянию, а не только записи.</text></svg>