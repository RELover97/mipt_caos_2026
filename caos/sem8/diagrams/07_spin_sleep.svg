<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Если работы нет: крутиться или спать?</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Потребитель ждёт, пока производитель положит число в общую ячейку</text><rect fill="#FFFFFF" height="453" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="592" x="34" y="111" /><rect fill="#BC4145" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="52" y="129" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="73" y="158">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="109" y="156">Активное ожидание</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="58" y="195">while (!ready) { /* снова проверить */ }</text><rect fill="#FFFFFF" height="453" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="592" x="653" y="111" /><rect fill="#087D6B" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="671" y="129" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="692" y="158">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="728" y="156">Условная переменная</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="677" y="195">while (!ready) pthread_cond_wait(...)</text><rect fill="#FFE9EB" height="96" rx="12" ry="12" stroke="none" stroke-width="1.5" width="490" x="83" y="250" /><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="328" y="290">проверка · проверка · проверка</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="328" y="322">CPU продолжает исполнять цикл</text><rect fill="#E7F6F0" height="96" rx="12" ry="12" stroke="none" stroke-width="1.5" width="490" x="700" y="250" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="945" y="288">поток спит (не крутит цикл)</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="945" y="322">ОС может дать CPU другому потоку</text><rect fill="#FFE9EB" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="468" x="83" y="402" /><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="95" y="427">Пустая ячейка: тратим CPU</text><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="468" x="702" y="402" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="714" y="427">Пустая ячейка: ждём события</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">И mutex, и condition variable не заменяют предикат ready: проверка остаётся обязательной.</text></svg>