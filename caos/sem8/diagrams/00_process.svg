<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Один процесс — несколько потоков</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Каждый поток исполняет код отдельно, но видит общие данные</text><rect fill="#FFFFFF" height="472" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="1210" x="35" y="102" /><rect fill="#E9EDF4" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="270" x="62" y="121" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="74" y="146">Процесс: одна программа</text><rect fill="#EAF3FF" height="155" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="330" x="76" y="191" /><rect fill="#2364C8" height="155" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="76" y="191" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="100" y="229">Поток 1</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="100" y="261">Свои регистры и стек</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="100" y="286">Локальная переменная local=1</text><rect fill="#F2EDFC" height="155" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="330" x="464" y="191" /><rect fill="#6F48BC" height="155" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="464" y="191" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="488" y="229">Поток 2</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="488" y="261">Свои регистры и стек</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="488" y="286">Локальная переменная local=1</text><rect fill="#FFF3D7" height="155" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="325" x="865" y="191" /><rect fill="#A96B08" height="155" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="865" y="191" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="889" y="229">Планировщик ОС</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="889" y="261">Выбирает, когда выполнять</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="889" y="286">каждый поток на ядре CPU</text><line stroke="#2364C8" stroke-linecap="round" stroke-width="3" x1="241" x2="241" y1="356" y2="402" /><polygon fill="#2364C8" points="241,402 235.72631907535376,392.3465918192059 246.27368092464624,392.3465918192059" /><line stroke="#6F48BC" stroke-linecap="round" stroke-width="3" x1="629" x2="629" y1="356" y2="402" /><polygon fill="#6F48BC" points="629,402 623.7263190753538,392.3465918192059 634.2736809246462,392.3465918192059" /><rect fill="#E7F6F0" height="112" rx="16" ry="16" stroke="#087D6B" stroke-width="2" width="725" x="80" y="414" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="112" y="458">Общая память процесса</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="112" y="492">Глобальный shared_number = 42; куча (heap)</text><line stroke="#A96B08" stroke-linecap="round" stroke-width="3" x1="1030" x2="1030" y1="356" y2="420" /><polygon fill="#A96B08" points="1030,420 1024.7263190753538,410.3465918192059 1035.2736809246462,410.3465918192059" /><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="868" y="462">Потоки могут чередоваться</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="868" y="493">или выполняться параллельно</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Важно: local у потоков разные, а shared_number — одна и та же переменная.</text></svg>