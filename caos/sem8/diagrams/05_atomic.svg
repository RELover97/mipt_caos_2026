<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Атомарность отдельного шага — не атомарность алгоритма</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Два потока одновременно хотят выполнить +1 при исходном counter = 0</text><rect fill="#FFFFFF" height="463" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="591" x="34" y="104" /><rect fill="#BC4145" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="52" y="122" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="73" y="151">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="109" y="149">load(); затем store()</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="58" y="188">Сами доступы atomic, но две операции раздельны</text><rect fill="#FFFFFF" height="463" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="592" x="653" y="104" /><rect fill="#087D6B" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="671" y="122" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="692" y="151">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="728" y="149">atomic_fetch_add(1)</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="677" y="188">Одно неделимое read–modify–write</text><rect fill="#FFE9EB" height="53" rx="11" ry="11" stroke="none" stroke-width="1.5" width="492" x="77" y="255" /><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="95" y="290">A: load(0) → store(1)</text><rect fill="#FFE9EB" height="53" rx="11" ry="11" stroke="none" stroke-width="1.5" width="492" x="77" y="327" /><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="95" y="362">B: load(0) → store(1)</text><rect fill="#E7F6F0" height="53" rx="11" ry="11" stroke="none" stroke-width="1.5" width="492" x="697" y="255" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="715" y="290">A: fetch_add(1)   0 → 1</text><rect fill="#E7F6F0" height="53" rx="11" ry="11" stroke="none" stroke-width="1.5" width="492" x="697" y="327" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="715" y="362">B: fetch_add(1)   1 → 2</text><rect fill="#FFE9EB" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="446" x="78" y="430" /><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="90" y="455">Итог = 1: логическая гонка</text><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="466" x="695" y="430" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="707" y="455">Итог = 2: оба увеличения учтены</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">В левой части нет data race, но есть race condition: алгоритм неверен.</text></svg>