<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Обмен данными через ячейку на одно число</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Производитель пишет; потребитель забирает; full — правдивое состояние ячейки</text><rect fill="#FFFFFF" height="450" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="287" x="33" y="109" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="51" y="127" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="72" y="156">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="108" y="154">Пусто</text><rect fill="#EAF3FF" height="117" rx="15" ry="15" stroke="#2364C8" stroke-width="3" width="193" x="80" y="238" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="176" y="282">full = false</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="176" y="317">Писать можно</text><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="66" y="433">старт</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="320" x2="340" y1="291" y2="291" /><polygon fill="#56677D" points="340,291 332.97933950487703,294.83540430883363 332.97933950487703,287.16459569116637" /><rect fill="#FFFFFF" height="450" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="287" x="342" y="109" /><rect fill="#A96B08" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="360" y="127" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="381" y="156">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="417" y="154">Положили 7</text><rect fill="#FFF3D7" height="117" rx="15" ry="15" stroke="#A96B08" stroke-width="3" width="193" x="389" y="238" /><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="485" y="282">value = 7</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="485" y="317">full = true</text><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="375" y="433">производитель</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="629" x2="649" y1="291" y2="291" /><polygon fill="#56677D" points="649,291 641.979339504877,294.83540430883363 641.979339504877,287.16459569116637" /><rect fill="#FFFFFF" height="450" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="287" x="651" y="109" /><rect fill="#087D6B" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="669" y="127" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="690" y="156">3</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="726" y="154">Забрали 7</text><rect fill="#E7F6F0" height="117" rx="15" ry="15" stroke="#087D6B" stroke-width="3" width="193" x="698" y="238" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="794" y="282">full = false</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="794" y="317">sum += 7</text><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="684" y="433">потребитель</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="938" x2="958" y1="291" y2="291" /><polygon fill="#56677D" points="958,291 950.979339504877,294.83540430883363 950.979339504877,287.16459569116637" /><rect fill="#FFFFFF" height="450" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="287" x="960" y="109" /><rect fill="#6F48BC" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="978" y="127" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="999" y="156">4</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="1035" y="154">Всё отправлено</text><rect fill="#F2EDFC" height="117" rx="15" ry="15" stroke="#6F48BC" stroke-width="3" width="193" x="1007" y="238" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="1103" y="282">closed = true</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="1103" y="317">Пусто → завершаем</text><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" x="993" y="433">производитель</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Две condition variable: not_empty для потребителя и not_full для производителя.</text></svg>