l, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="680" y="274">CAS(0 → 1): отказ</text><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="680" y="315">B получает expected=1</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="939" x2="952" y1="316" y2="316" /><polygon fill="#56677D" points="952,316 944.979339504877,319.83540430883363 944.979339504877,312.16459569116637" /><rect fill="#FFFFFF" height="443" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="288" x="956" y="112" /><rect fill="#087D6B" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="974" y="130" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="995" y="159">4</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="1031" y="157">B повторяет</text><rect fill="#E7F6F0" height="164" rx="12" ry="12" stroke="none" stroke-width="1.5" width="252" x="974" y="234" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="987" y="274">CAS(1 → 2): успех</text><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="987" y="315">В памяти: counter=2</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">При неудаче compare_exchange обновляет expected; desired надо пересчитать.</text></svg>