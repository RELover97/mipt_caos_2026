<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Почему два прибавления дают только +1?</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Модель чередования действий для иллюстрации потерянного обновления (не обещание поведения C с data race)</text><rect fill="#FFFFFF" height="428" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="289" x="34" y="115" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="52" y="133" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="73" y="162">1</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="109" y="160">Старт</text><rect fill="#EAF3FF" height="83" rx="13" ry="13" stroke="none" stroke-width="1.5" width="240" x="59" y="245" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="179" y="294">counter = 5</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="62" y="379">A и B ещё не читали</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="325" x2="339" y1="282" y2="282" /><polygon fill="#56677D" points="339,282 331.97933950487703,285.83540430883363 331.97933950487703,278.16459569116637" /><rect fill="#FFFFFF" height="428" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="289" x="340" y="115" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="358" y="133" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="379" y="162">2</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="415" y="160">Оба прочитали</text><rect fill="#EAF3FF" height="83" rx="13" ry="13" stroke="none" stroke-width="1.5" width="240" x="365" y="245" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="485" y="294">A: 5   B: 5</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="368" y="379">Каждый сохранил копию</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="631" x2="645" y1="282" y2="282" /><polygon fill="#56677D" points="645,282 637.979339504877,285.83540430883363 637.979339504877,278.16459569116637" /><rect fill="#FFFFFF" height="428" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="289" x="646" y="115" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="664" y="133" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="685" y="162">3</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="721" y="160">Оба прибавили</text><rect fill="#EAF3FF" height="83" rx="13" ry="13" stroke="none" stroke-width="1.5" width="240" x="671" y="245" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="791" y="294">A: 6   B: 6</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="674" y="379">Копии независимы</text><line stroke="#56677D" stroke-linecap="round" stroke-width="3" x1="937" x2="951" y1="282" y2="282" /><polygon fill="#56677D" points="951,282 943.979339504877,285.83540430883363 943.979339504877,278.16459569116637" /><rect fill="#FFFFFF" height="428" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="289" x="952" y="115" /><rect fill="#2364C8" height="42" rx="12" ry="12" stroke="none" stroke-width="1.5" width="42" x="970" y="133" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="991" y="162">4</text><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="1027" y="160">Оба записали</text><rect fill="#FFE9EB" height="83" rx="13" ry="13" stroke="none" stroke-width="1.5" width="240" x="977" y="245" /><text fill="#BC4145" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="1097" y="294">counter = 6</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="980" y="379">Ожидалось 7</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Два потока обновляют одну переменную. Проблема — потеря промежуточного результата.</text></svg>