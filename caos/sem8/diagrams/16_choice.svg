<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Как понять, какой механизм использовать?</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">Подбирайте инструмент по задаче, а не по обещанию «быстрее»</text><rect fill="#FFFFFF" height="157" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="574" x="40" y="145" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="62" y="186">Нужно менять несколько общих полей?</text><rect fill="#EAF3FF" height="63" rx="12" ry="12" stroke="none" stroke-width="1.5" width="529" x="60" y="212" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="79" y="250">pthread_mutex_t</text><rect fill="#FFFFFF" height="157" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="574" x="666" y="145" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="688" y="186">Нужно неделимо увеличить одно число?</text><rect fill="#E7F6F0" height="63" rx="12" ry="12" stroke="none" stroke-width="1.5" width="529" x="686" y="212" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="705" y="250">_Atomic + fetch_add</text><rect fill="#FFFFFF" height="157" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="574" x="40" y="342" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="62" y="383">Нет данных — поток должен уснуть?</text><rect fill="#F2EDFC" height="63" rx="12" ry="12" stroke="none" stroke-width="1.5" width="529" x="60" y="409" /><text fill="#6F48BC" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="79" y="447">pthread_cond_t + mutex</text><rect fill="#FFFFFF" height="157" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="574" x="666" y="342" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" x="688" y="383">Нужна неблокирующая структура?</text><rect fill="#FFF3D7" height="63" rx="12" ry="12" stroke="none" stroke-width="1.5" width="529" x="686" y="409" /><text fill="#A96B08" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="705" y="447">CAS + анализ ABA/времени жизни</text><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Linux futex — строительный блок для ожидания; в обычном C-коде предпочитайте pthread.</text></svg>