<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1280 640" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FD" height="640" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><rect fill="#10243B" height="84" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1280" x="0" y="0" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="40" y="37">Как безопасно передать вместе с флагом другие данные</text><text fill="#C9D8EF" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="40" y="67">release публикует предшествующие записи; acquire на чтении флага позволяет их увидеть</text><rect fill="#FFFFFF" height="432" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="580" x="35" y="112" /><rect fill="#FFFFFF" height="432" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="580" x="664" y="112" /><rect fill="#EAF3FF" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="219" x="63" y="142" /><text fill="#2364C8" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="75" y="167">Производитель</text><rect fill="#E7F6F0" height="36" rx="10" ry="10" stroke="none" stroke-width="1.5" width="219" x="692" y="142" /><text fill="#087D6B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="704" y="167">Потребитель</text><rect fill="#EAF3FF" height="115" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="489" x="74" y="220" /><rect fill="#2364C8" height="115" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="74" y="220" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="98" y="258">payload = 42;</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="98" y="290">Сначала обычная запись данных</text><rect fill="#E7F6F0" height="107" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="489" x="74" y="371" /><rect fill="#087D6B" height="107" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="74" y="371" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="98" y="409">atomic_store_release(ready, 1)</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="98" y="441">Затем публикация готовности</text><rect fill="#E7F6F0" height="115" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="489" x="703" y="220" /><rect fill="#087D6B" height="115" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="703" y="220" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="727" y="258">atomic_load_acquire(ready)</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="727" y="290">Увидел 1? Значит, данные доступны</text><rect fill="#EAF3FF" height="107" rx="17" ry="17" stroke="#D9E2EF" stroke-width="1.5" width="489" x="703" y="371" /><rect fill="#2364C8" height="107" rx="3" ry="3" stroke="none" stroke-width="1.5" width="7" x="703" y="371" /><text fill="#10243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="727" y="409">read payload</text><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="727" y="441">Можно безопасно прочесть 42</text><line stroke="#087D6B" stroke-linecap="round" stroke-width="4" x1="567" x2="696" y1="412" y2="281" /><polygon fill="#087D6B" points="696,281 692.9843470376111,291.5785555351586 685.4690882067082,284.1780334803001" /><rect fill="#ECF1F8" height="40" rx="8" ry="8" stroke="none" stroke-width="1.5" width="1212" x="34" y="579" /><text fill="#56677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="52" y="605">Счётчику достаточно relaxed; указателю на готовый узел стека нужны гарантии публикации.</text></svg>